# Catálogo de DracApps — fuente curada por el admin.
#
# Esto es lo ÚNICO que se edita a mano. El catálogo publicado (docs/catalogo.json)
# se genera desde aquí con:
#
#     python scripts/generar_catalogo.py --dry-run    # comprueba sin publicar
#     python scripts/generar_catalogo.py --publicar   # publica de verdad
#
# Añadir una app es una línea:
#
#     - repo: marcmayol/mi-app
#
# Todo lo demás (nombre, versión, tamaño, hash, icono) sale del propio APK de la
# última Release. No hace falta escribirlo ni mantenerlo.

catalogo:
  titulo: DracApps
  # URL canónica, sin redirecciones. marcmayol.github.io/DracApps/ existe, pero
  # responde 301 hacia http:// (sin cifrar), y un catálogo que se puede alterar por
  # el camino se lleva por delante los hashes de todos los APKs. El cliente pide
  # esta y no sigue redirecciones que bajen a http.
  url_publica: https://marcmayol.com/DracApps/catalogo.json

apps:
  # Registro de comidas con recordatorios a la hora que elija cada uno.
  - repo: marcmayol/cronicas-del-apetito

  # Plan de gimnasio de 100 días con entrenamiento guiado en vivo.
  # Su Release publica dos APKs (móvil y reloj); el del catálogo es el del móvil.
  # El nombre lleva la versión dentro, así que se elige por patrón: el "-reloj-"
  # queda fuera solo y no hay que tocar esto en cada versión.
  - repo: marcmayol/building-my-future
    apk: building-my-future-v*.apk

  # Seguimiento de medicación, tensión y antecedentes de salud.
  - repo: marcmayol/grimorio-de-pociones

  # Hábitos recurrentes multi-ámbito.
  - repo: marcmayol/kuse

  # Los pasos del día convertidos en avance por la ruta a Mordor.
  - repo: marcmayol/middle_earth_journey

  # Planificador de fotos de la Luna alineada con torres y edificios.
  - repo: marcmayol/lunalign

  # Portapapeles compartido con el PC, solo por red local y cifrado de extremo a extremo.
  # Su Release lleva también el instalador de Windows, que es la otra mitad de la app:
  # se elige el APK por patrón para que el .exe no confunda al generador.
  - repo: marcmayol/dracpaste
    apk: dracpaste-v*.apk

  # Visor de PDF con formularios, firma dibujada y firma digital PAdES.
  - repo: marcmayol/DracPDF-Android

# ---------------------------------------------------------------------------
# Campos opcionales por app, todos con valores por defecto sensatos:
#
#   activo: false        Deja la app apuntada pero fuera del catálogo publicado.
#   nombre: "Otro"       Sustituye el nombre que trae el APK.
#   descripcion: "..."   Sustituye la descripción del repo.
#   notas: "..."         Sustituye las notas de versión del cuerpo de la Release.
#   icono: "https://..." Sustituye el icono extraído del APK (usar solo si sale mal).
#   apk: "nombre.apk"    Elige el APK cuando la Release publica más de uno.
#
# Campos de extensión, declarados pero todavía sin efecto (el cliente los ignora):
#
#   canal: estable       Previsto para separar estable de beta.
#   min_sdk: 26          Previsto para avisar de apps incompatibles con el móvil.
# ---------------------------------------------------------------------------
